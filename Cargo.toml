[workspace]
resolver = "2"
members = [
    # Core libraries — pure/reusable logic, no binaries.
    "libs/babydra-core",
    "libs/babydra-island",
    "libs/babydra-theme",
    "libs/babydra-ui-kit",  # UI kit — GTK components + explore feature components
    # Applications — each crate ships its own binary.
    "crates/babydra-panel",
    "crates/babydra-switcher",
    "crates/babydra-screenshot",
    "crates/babydra-lock",
    "crates/babydra-preview",
    "crates/babydra-settings",
    "crates/babydra-explore",
    "crates/babydra-greeter",
    "crates/babydra-launcher",
    "tests",
]
exclude = [
    ".old_project",
    ".old_project/*",
    ".old_project/I4ArchSettings/src-tauri",
]

[workspace.package]
version = "1.0.0"
edition = "2021"

[workspace.dependencies]
# libs/
babydra-core = { path = "libs/babydra-core" }
babydra-island = { path = "libs/babydra-island" }
babydra-theme = { path = "libs/babydra-theme" }
# libs/babydra-ui-kit (components + explore feature components)
babydra-ui-kit = { path = "libs/babydra-ui-kit" }
# crates/
babydra-launcher = { path = "crates/babydra-launcher" }

# --- External dependencies (single source of truth) ---
gtk4 = { version = "0.9", features = ["v4_10"] }
gtk4-layer-shell = "0.4"
glib = "0.20"
gio = "0.20"
gdk4 = "0.9"
gdk-pixbuf = "0.20"
cairo-rs = { version = "0.20", features = ["use_glib", "png"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["rt", "rt-multi-thread", "time", "sync", "macros", "process", "fs", "io-util"] }
chrono = "0.4"
thiserror = "2.0"
trash = "3.0"
dirs = "5.0"
base64 = "0.23.1"
rayon = "1.10"
tracing = "0.1"
kamadak-exif = "0.5"
