[package]
name = "babydra-tests"
version.workspace = true
edition = "2021"
publish = false
description = "Integration test suite for the BabyDra workspace (TDD safety net)."

# Integration tests are declared explicitly so each test file in the
# sub-folders below (common/, models/, services/, theme/) is compiled as its
# own fast, focused test binary.
[dev-dependencies]
babydra-core = { workspace = true }
babydra-theme = { workspace = true }
chrono = "0.4"
serde_json = "1.0"
toml = "0.8"

[[test]]
name = "services_workspace"
path = "services/workspace.rs"

[[test]]
name = "common_config"
path = "common/config.rs"

[[test]]
name = "common_i18n"
path = "common/i18n.rs"

[[test]]
name = "common_storage"
path = "common/storage.rs"

[[test]]
name = "common_variant"
path = "common/variant.rs"

[[test]]
name = "common_vpn"
path = "common/vpn.rs"

[[test]]
name = "common_volume"
path = "common/volume.rs"

[[test]]
name = "common_wifi"
path = "common/wifi.rs"

[[test]]
name = "models_explore_grouping"
path = "models/explore_grouping.rs"

[[test]]
name = "models_shell_theme_config"
path = "models/shell_theme_config.rs"

[[test]]
name = "services_updates"
path = "services/updates.rs"

[[test]]
name = "services_explore_uri"
path = "services/explore_uri.rs"

[[test]]
name = "services_kitty_theme"
path = "services/kitty_theme.rs"

[[test]]
name = "theme_engine"
path = "theme/engine.rs"

[[test]]
name = "theme_tokens"
path = "theme/tokens.rs"

[[test]]
name = "theme_shipped"
path = "theme/shipped.rs"
