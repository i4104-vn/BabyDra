[package]
name = "babydra-workspace"
version.workspace = true
edition = "2021"

[lib]
name = "babydra_workspace"
path = "src/lib.rs"

[[bin]]
name = "babydra-workspace"
path = "src/main.rs"

[dependencies]
babydra-core = { workspace = true }
babydra-ui-kit = { workspace = true }

# GUI & Layer Shell
gtk4 = { workspace = true }
gtk4-layer-shell = { workspace = true }
glib = { workspace = true }
gio = { workspace = true }

# Serialization & System
serde = { workspace = true }
serde_json = { workspace = true }
dirs = { workspace = true }
