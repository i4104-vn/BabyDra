[meta]
name = "BabyDra"
version = "1.0.0"
description = "Modern Wayland Desktop Shell for Arch Linux"

# ==============================================================================
# PACKAGES
# ==============================================================================
[packages]
# Danh sách package chính thức từ kho Arch Linux (cài đặt bằng pacman)
pacman = [
    "base-devel",
    "git",
    "pkgconf",
    "gtk4",
    "gtk4-layer-shell",
    "rust",
    "labwc",
    "meson",
    "ninja",
    "playerctl",
    "grim",
    "slurp",
    "wl-clipboard",
    "libnotify",
    "gammastep",
    "wlsunset",
    "wireplumber",
    "pipewire-pulse",
    "pipewire-alsa",
    "ddcutil",
    "zip",
    "unzip",
    "p7zip",
    "unrar",
    "pacman-contrib",
    "xdg-utils",
    "polkit",
    "networkmanager",
    "networkmanager-openvpn",
    "networkmanager-vpnc",
    "networkmanager-pptp",
    "networkmanager-l2tp",
    "networkmanager-openconnect",
    "networkmanager-strongswan",
    "wireguard-tools",
    "openvpn",
    "bluez",
    "bluez-utils",
    "greetd",
    "cage",
    "chafa",
    "imagemagick",
    "gst-plugins-good",
    "gst-plugins-bad",
    "gst-plugin-va",
    "gst-libav",
    "ffmpeg",
    "wf-recorder",
    "brightnessctl",
    "pam",
    "tesseract",
    "tesseract-data-eng",
    "tesseract-data-vie",
    "bc",
    "jq",
    "gvfs",
    "fcitx5",
    "fcitx5-gtk",
    "fcitx5-qt",
    "fcitx5-configtool",
    "fcitx5-unikey",
    "fcitx5-bamboo"
]

# Danh sách package từ Arch User Repository (cài đặt bằng yay)
yay = [
    "github-desktop",
    "fastfetch",
    "neovim",
    "ddcutil-service",
    "kitty",
    "ttf-quicksand-variable",
    "ttf-segoe-ui-variable",
    "ttf-cascadia-code-nerd",
    "inter-font",
    "ttf-ubuntu-font-family",
    "ttf-jetbrains-mono-nerd",
    "ttf-nerd-fonts-symbols",
    "ttf-nerd-fonts-symbols-mono",
    "otf-font-awesome",
    "ttf-font-awesome",
    "noto-fonts",
    "noto-fonts-cjk",
    "noto-fonts-emoji",
    "noto-fonts-extra",
    "ttf-liberation",
    "papirus-icon-theme",
    "kvantum-qt5",
    "wlrctl"
]

# ==============================================================================
# BINARIES & SERVICES
# ==============================================================================
[binaries]
# Danh sách binaries cần cài vào ~/.local/bin/ (user space)
user_binaries = [
    "babydra-panel",
    "babydra-desktop",
    "babydra-switcher",
    "babydra-screenshot",
    "babydra-lock",
    "babydra-launcher",
    "babydra-preview",
    "babydra-settings",
    "babydra-explore",
    "babydra-keymap",
    "babydra-notepad"
]

# Binaries hệ thống cần cài vào /usr/bin/ (cần sudo)
system_binaries = [
    "babydra-greeter"
]

# Các tiến trình shell tự động khởi động sau khi reload/update
shell_daemons = [
    "babydra-switcher --daemon",
    "babydra-panel",
    "babydra-desktop",
    "babydra-keymap"
]

# Các tiến trình cần dừng trước khi build/update/restart
kill_processes = [
    "babydra-panel",
    "babydra-desktop",
    "babydra-switcher",
    "babydra-screenshot",
    "babydra-lock",
    "babydra-launcher",
    "babydra-image-preview",
    "babydra-preview",
    "babydra-settings",
    "babydra-explore",
    "babydra-greeter",
    "babydra-keymap",
    "babydra-notepad",
    "fnott",
    "xfce4-notifyd"
]

# ==============================================================================
# DESKTOP ENVIRONMENT SETTINGS (gsettings)
# ==============================================================================
[gsettings]
font_name = "Quicksand 12"
document_font_name = "Quicksand 12"
monospace_font_name = "CaskaydiaCove Nerd Font 11"
icon_theme = "We10X"
cursor_theme = "Twilight-cursors"
cursor_size = 24

# ==============================================================================
# MIME ASSOCIATIONS (xdg-mime default)
# ==============================================================================
[mime_defaults]
"image/png" = "babydra-preview.desktop"
"image/jpeg" = "babydra-preview.desktop"
"image/gif" = "babydra-preview.desktop"
"image/webp" = "babydra-preview.desktop"
"image/bmp" = "babydra-preview.desktop"
"inode/directory" = "babydra-explore.desktop"
"text/plain" = "babydra-notepad.desktop"

# ==============================================================================
# DISPLAY MANAGER (greetd)
# ==============================================================================
[greetd]
vt = 1
command = "sh -c 'clear 2>/dev/null; setterm -cursor off 2>/dev/null; exec cage -s -- /usr/bin/babydra-greeter'"
user = "greeter"
mask_vt_range = [2, 3, 4, 5, 6]
