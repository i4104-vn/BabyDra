[package]
name = "babydra-core"
version.workspace = true
edition = "2021"

[dependencies]
serde = { workspace = true }
toml = "0.8"
tracing = "0.1"
thiserror = { workspace = true }

# Pure-data & system services only — core must NOT depend on gtk4
glib = { workspace = true }
gio = { workspace = true }
gdk-pixbuf = { workspace = true }
gdk4 = { workspace = true }
dirs = { workspace = true }
serde_json = { workspace = true }
zbus = { version = "4.0", features = ["blocking"] }
tokio = { workspace = true }
libc = "0.2"
cairo-rs = { workspace = true }
chrono = { workspace = true }
kamadak-exif = "0.5"

# File Manager dependencies
notify = "6.0"
trash = "3.0"
mime_guess = "2.0"
walkdir = "2.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
rayon = "1.10"
rustc-hash = "2.0"
lazy_static = "1.4"
fuzzy-matcher = "0.3.7"
base64 = { workspace = true }


