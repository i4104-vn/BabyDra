<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- ── Default sans-serif font ─────────────────────────── -->
  <match target="pattern">
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="assign" binding="same">
      <string>Segoe UI Variable Static Text</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>sans</string></test>
    <edit name="family" mode="assign" binding="same">
      <string>Segoe UI Variable Static Text</string>
    </edit>
  </match>

  <!-- ── Default serif font ──────────────────────────────── -->
  <match target="pattern">
    <test qual="any" name="family"><string>serif</string></test>
    <edit name="family" mode="assign" binding="same">
      <string>Noto Serif</string>
    </edit>
  </match>

  <!-- ── Default monospace font ──────────────────────────── -->
  <match target="pattern">
    <test qual="any" name="family"><string>monospace</string></test>
    <edit name="family" mode="assign" binding="same">
      <string>JetBrainsMono Nerd Font</string>
    </edit>
  </match>

  <!-- ── Emoji / Color Icon Fallback ─────────────────────── -->
  <!-- Ensure color emoji are rendered everywhere -->
  <match target="pattern">
    <test qual="any" name="family"><string>emoji</string></test>
    <edit name="family" mode="assign" binding="same">
      <string>Noto Color Emoji</string>
    </edit>
  </match>

  <!-- ── Global Fallback Chain ───────────────────────────── -->
  <!-- Append fallback fonts for all families to cover missing glyphs -->
  <match target="pattern">
    <edit name="family" mode="append">
      <string>Noto Color Emoji</string>
    </edit>
  </match>
  <match target="pattern">
    <edit name="family" mode="append">
      <string>Symbols Nerd Font</string>
    </edit>
  </match>
  <match target="pattern">
    <edit name="family" mode="append">
      <string>Font Awesome 6 Free</string>
    </edit>
  </match>
  <match target="pattern">
    <edit name="family" mode="append">
      <string>Noto Sans CJK SC</string>
    </edit>
  </match>
  <match target="pattern">
    <edit name="family" mode="append">
      <string>Noto Sans CJK JP</string>
    </edit>
  </match>
  <match target="pattern">
    <edit name="family" mode="append">
      <string>Noto Sans CJK KR</string>
    </edit>
  </match>
  <match target="pattern">
    <edit name="family" mode="append">
      <string>Noto Sans Arabic</string>
    </edit>
  </match>
  <match target="pattern">
    <edit name="family" mode="append">
      <string>Noto Sans Thai</string>
    </edit>
  </match>
  <match target="pattern">
    <edit name="family" mode="append">
      <string>Noto Sans Devanagari</string>
    </edit>
  </match>

  <!-- ── Hinting & Rendering ─────────────────────────────── -->
  <!-- Enable subpixel rendering for sharper text on LCD screens -->
  <match target="font">
    <edit name="rgba" mode="assign"><const>rgb</const></edit>
  </match>
  <match target="font">
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
  </match>
  <match target="font">
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
  </match>
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
  </match>
  <match target="font">
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
  </match>

  <!-- ── Prefer color emoji over monochrome ──────────────── -->
  <match target="font">
    <test name="family" compare="contains"><string>Noto Color Emoji</string></test>
    <edit name="scalable" mode="assign"><bool>true</bool></edit>
    <edit name="color" mode="assign"><bool>true</bool></edit>
  </match>
</fontconfig>
