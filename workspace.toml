# Deployment metadata owned by this source branch.
# The installer on main reads this file after checking out the branch.

[[binaries]]
name = "babydra-panel"
scope = "user"

[[binaries]]
name = "babydra-desktop"
scope = "user"

[[binaries]]
name = "babydra-switcher"
scope = "user"

[[binaries]]
name = "babydra-keymap"
scope = "user"

[[binaries]]
name = "babydra-explore"
scope = "user"
description = "GTK4 file manager"
export_desktop = true

[[binaries]]
name = "babydra-settings"
scope = "user"
description = "Desktop and system settings application"
export_desktop = true

[[binaries]]
name = "babydra-launcher"
scope = "user"
description = "Application launcher and fuzzy search"

[[binaries]]
name = "babydra-lock"
scope = "user"

[[binaries]]
name = "babydra-greeter"
scope = "system"

[[binaries]]
name = "babydra-screenshot"
scope = "user"

[[binaries]]
name = "babydra-preview"
scope = "user"
export_desktop = true

[packages]
pacman = [
    "base-devel",
    "git",
    "pkgconf",
    "gtk4",
    "gtk4-layer-shell",
    "rust",
    "labwc",
    "meson",
    "ninja",
    "playerctl",
    "grim",
    "slurp",
    "wl-clipboard",
    "libnotify",
    "gammastep",
    "wlsunset",
    "wireplumber",
    "pipewire-pulse",
    "pipewire-alsa",
    "ddcutil",
    "zip",
    "unzip",
    "p7zip",
    "unrar",
    "pacman-contrib",
    "xdg-utils",
    "polkit",
    "networkmanager",
    "networkmanager-openvpn",
    "networkmanager-vpnc",
    "networkmanager-pptp",
    "networkmanager-l2tp",
    "networkmanager-openconnect",
    "networkmanager-strongswan",
    "wireguard-tools",
    "openvpn",
    "bluez",
    "bluez-utils",
    "greetd",
    "cage",
    "chafa",
    "imagemagick",
    "gst-plugins-good",
    "gst-plugins-bad",
    "gst-plugin-va",
    "gst-libav",
    "ffmpeg",
    "wf-recorder",
    "brightnessctl",
    "pam",
    "tesseract",
    "tesseract-data-eng",
    "tesseract-data-vie",
    "bc",
    "jq",
    "gvfs",
    "fcitx5",
    "fcitx5-gtk",
    "fcitx5-qt",
    "fcitx5-configtool",
    "fcitx5-unikey",
    "fcitx5-bamboo",
]

aur = [
    "github-desktop",
    "fastfetch",
    "neovim",
    "ddcutil-service",
    "kitty",
    "ttf-segoe-ui-variable",
    "ttf-cascadia-code-nerd",
    "inter-font",
    "ttf-ubuntu-font-family",
    "ttf-jetbrains-mono-nerd",
    "ttf-nerd-fonts-symbols",
    "ttf-nerd-fonts-symbols-mono",
    "otf-font-awesome",
    "ttf-font-awesome",
    "noto-fonts",
    "noto-fonts-cjk",
    "noto-fonts-emoji",
    "noto-fonts-extra",
    "ttf-liberation",
    "papirus-icon-theme",
    "kvantum-qt5",
    "wlrctl",
]

[installer]
# Optional system steps required by this source branch.
features = ["wtype", "kernel_permissions", "greetd"]

[gsettings]
"org.gnome.desktop.interface.font-name" = "Segoe UI 13"
"org.gnome.desktop.interface.document-font-name" = "Segoe UI 13"
"org.gnome.desktop.interface.monospaced-font-name" = "Cascadia Code 11"
"org.gnome.desktop.interface.icon-theme" = "We10X"
"org.gnome.desktop.interface.cursor-theme" = "Twilight-cursors"
"org.gnome.desktop.interface.cursor-size" = "24"
"org.gnome.desktop.wm.preferences.button-layout" = "close,minimize,maximize:"
