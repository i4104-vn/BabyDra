[package]
name = "babydra-common"
version.workspace = true
edition = "2021"



[dependencies]
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
tracing = "0.1"

# GTK4 for theme provider support
gtk4 = { version = "0.9", features = ["v4_10"] }
gtk4-layer-shell = "0.4.0"
glib = "0.20"
gio = "0.20"
gdk-pixbuf = "0.20"
gdk4 = "0.9"
dirs = "5.0"
serde_json = "1.0"
zbus = { version = "4.0", features = ["blocking"] }
tokio = { version = "1.0", features = ["rt", "rt-multi-thread", "time", "sync", "macros"] }

