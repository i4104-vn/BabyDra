# BabyDra variant: rose (rose accent — babydra-rose).
# Each variant lives in its own folder — see docs/05-themes-variants.md.
name = "rose"
theme = "babydra-rose"
apps = [
    "panel",
    "explore",
    "settings",
    "switcher",
    "screenshot",
    "lock",
    "greeter",
    "preview",
]

# Keybinds: action → app/binary name.
[keybinds]
"A-Tab" = "babydra-switcher"
"W-q" = "babydra-launcher"
"Print" = "babydra-screenshot"

# Optional: seed config overrides merged on top of configs/.
[config_overrides]
"labwc.rc.margin.gap" = 12
