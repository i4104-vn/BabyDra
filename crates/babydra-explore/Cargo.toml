[package]
name = "babydra-explore"
version.workspace = true
edition = "2021"

[dependencies]
babydra-common = { workspace = true }
baby-utils = { workspace = true }

# GUI
gtk4 = { version = "0.9", features = ["v4_10"] }

# Async & utilities
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
glib = "0.20"
gio = "0.20"
gdk4 = "0.9"
gdk-pixbuf = "0.20"
