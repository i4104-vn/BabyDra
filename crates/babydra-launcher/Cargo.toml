[package]
name = "babydra-launcher"
version.workspace = true
edition = "2021"

[dependencies]
babydra-core = { workspace = true }
babydra-ui-kit = { workspace = true }

# GUI & Layer Shell
gtk4 = { version = "0.9", features = ["v4_10"] }
gtk4-layer-shell = "0.4.0"

# Async & utilities
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
dirs = "5.0"

