[workspace]
resolver = "2"
members = [
    # Core libraries — pure/reusable logic, no binaries.
    "libs/babydra-core",
    "libs/babydra-island",
    "libs/babydra-theme",
    # Feature kits — component collections for a domain, extendable via API.
    "kits/babydra-ui-kit",
    "kits/babydra-explore-kit",
    # Applications — each crate ships its own binary.
    "crates/babydra-panel",
    "crates/babydra-switcher",
    "crates/babydra-screenshot",
    "crates/babydra-lock",
    "crates/babydra-preview",
    "crates/babydra-settings",
    "crates/babydra-explore",
    "crates/babydra-greeter",
    "crates/babydra-launcher",
    "install",
    "tests",
]
exclude = [
    ".old_project",
    ".old_project/*",
    ".old_project/I4ArchSettings/src-tauri",
]

[workspace.package]
version = "1.0.0"

[workspace.dependencies]
# libs/
babydra-core = { path = "libs/babydra-core" }
babydra-island = { path = "libs/babydra-island" }
babydra-theme = { path = "libs/babydra-theme" }
# kits/
babydra-ui-kit = { path = "kits/babydra-ui-kit" }
babydra-explore-kit = { path = "kits/babydra-explore-kit" }
# crates/
babydra-launcher = { path = "crates/babydra-launcher" }
