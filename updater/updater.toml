[meta]
name = "BabyDra"
version = "1.0.0"
description = "Modern Wayland Desktop Shell for Arch Linux"

# ==============================================================================
# DAEMONS & SERVICES
# ==============================================================================
[binaries]
# Shell daemons automatically launched in the background after update/reload
shell_daemons = [
    "babydra-switcher --daemon",
    "babydra-panel",
    "babydra-desktop",
    "babydra-keymap"
]

# ==============================================================================
# MIME ASSOCIATIONS (xdg-mime default)
# ==============================================================================
[mime_defaults]
"image/png" = "babydra-preview.desktop"
"image/jpeg" = "babydra-preview.desktop"
"image/gif" = "babydra-preview.desktop"
"image/webp" = "babydra-preview.desktop"
"image/bmp" = "babydra-preview.desktop"
"inode/directory" = "babydra-explore.desktop"
"text/plain" = "babydra-notepad.desktop"
"text/x-shellscript" = "babydra-notepad.desktop"
"application/x-shellscript" = "babydra-notepad.desktop"
"text/x-zsh" = "babydra-notepad.desktop"
"text/x-bash" = "babydra-notepad.desktop"
"text/x-sh" = "babydra-notepad.desktop"
"text/markdown" = "babydra-notepad.desktop"
"text/x-markdown" = "babydra-notepad.desktop"
"application/json" = "babydra-notepad.desktop"
"application/toml" = "babydra-notepad.desktop"
"text/x-toml" = "babydra-notepad.desktop"
"application/yaml" = "babydra-notepad.desktop"
"text/yaml" = "babydra-notepad.desktop"
"text/x-yaml" = "babydra-notepad.desktop"
"application/x-yaml" = "babydra-notepad.desktop"
"text/x-ini" = "babydra-notepad.desktop"
"text/x-config" = "babydra-notepad.desktop"
"application/x-config" = "babydra-notepad.desktop"
"text/x-makefile" = "babydra-notepad.desktop"
